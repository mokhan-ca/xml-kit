plugins:
  - rubocop-rspec

AllCops:
  Exclude:
    - 'coverage/**/*'
    - 'pkg/**/*'
    - 'spec/fixtures/**/*'
    - 'tmp/**/*'
    - 'vendor/**/*'
  NewCops: disable
  SuggestExtensions: false
  TargetRubyVersion: 2.7

Layout/BlockAlignment:
  EnforcedStyleAlignWith: start_of_line
  Exclude:
    - 'lib/**/*.builder'
    - 'spec/**/*'

Layout/EndOfLine:
  EnforcedStyle: lf

Layout/FirstArrayElementIndentation:
  EnforcedStyle: consistent

Layout/MultilineOperationIndentation:
  EnforcedStyle: indented

Lint/AmbiguousBlockAssociation:
  Exclude:
    - 'spec/**/*.rb'

Lint/ConstantDefinitionInBlock:
  Exclude:
    - 'spec/xml/kit/templatable_spec.rb'

Lint/DeprecatedOpenSSLConstant:
  Enabled: false

Lint/EmptyFile:
  Exclude:
    - 'lib/xml/kit/templates/nil_class.builder'

Lint/InterpolationCheck:
  Exclude:
    - 'spec/**/*.rb'

Metrics/AbcSize:
  Exclude:
    - 'lib/xml/kit/self_signed_certificate.rb'

Metrics/BlockLength:
  Exclude:
    - '**/**/*.builder'
    - '**/*.rake'
    - '*.gemspec'
    - 'Rakefile'
    - 'spec/**/*.rb'

Metrics/ModuleLength:
  Exclude:
    - 'spec/**/*.rb'

Layout/LineLength:
  AllowedPatterns: ['(\A|\s)#']
  Exclude:
    - 'spec/**/*.rb'
    - 'lib/xml/kit/templates/*.builder'

Naming/FileName:
  Exclude:
    - 'lib/xml-kit.rb'

Style/AccessorGrouping:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/EachWithObject:
  Enabled: false

Style/GlobalStdStream:
  Enabled: false

Style/KeywordParametersOrder:
  Enabled: false

Style/SlicingWithRange:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: 'single_quotes'

Style/TrailingCommaInArrayLiteral:
  Enabled: false

Style/TrailingCommaInHashLiteral:
  Enabled: false

RSpec/ExampleLength:
  Max: 80

RSpec/IdenticalEqualityAssertion:
  Exclude:
    - 'spec/xml/kit/certificate_spec.rb'

RSpec/LeakyConstantDeclaration:
  Exclude:
    - 'spec/xml/kit/templatable_spec.rb'

RSpec/MatchArray:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/NamedSubject:
  Enabled: false

RSpec/NestedGroups:
  Max: 7

RSpec/SpecFilePathFormat:
  Exclude:
    - 'spec/xml/kit/kit_spec.rb'

RSpec/SubjectStub:
  Enabled: false

Style/DoubleNegation:
  Exclude:
    - 'lib/xml/kit/certificate.rb'

Style/YodaCondition:
  Enabled: false
